<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Agent App</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, system-ui, sans-serif; background: #101216; color: #f2f4f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(680px, calc(100vw - 48px)); border: 1px solid #2d3340; border-radius: 14px; padding: 28px; background: #171a21; box-shadow: 0 18px 60px rgba(0,0,0,.35); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    #status { color: #b7c0d1; line-height: 1.5; }
    #error { display: none; margin-top: 16px; white-space: pre-wrap; color: #ffd3d3; background: #351b1f; border: 1px solid #6e3038; border-radius: 10px; padding: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Pi Agent App</h1>
    <div id="status">Starting desktop runtime...</div>
    <div id="error"></div>
  </main>
  <script>
    window.setPiAgentStatus = (message) => {
      document.getElementById('status').textContent = message;
    };
    window.setPiAgentError = (message) => {
      document.getElementById('status').textContent = 'Startup failed';
      const error = document.getElementById('error');
      error.style.display = 'block';
      error.textContent = message;
    };
  </script>
</body>
</html>
